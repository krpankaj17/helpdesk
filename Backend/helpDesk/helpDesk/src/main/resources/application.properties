spring.application.name=helpDesk

# PostgreSQL Database Configuration (Environment variable overrides with local defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Migration with Flyway
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET:Aw87T0dZQ82kMFi/OSc8RtrDtXg2YVVb5DiRxYvV/Hs=}
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION:7200000}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# CORS Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*}

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.datansh.HelpDesk=INFO